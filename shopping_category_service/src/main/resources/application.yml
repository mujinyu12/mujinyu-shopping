spring:
  application:
    name: shopping_category_service
  profiles:
    active: dev
  # Spring Cloud 2025 使用 spring.config.import 加载 Nacos 配置，bootstrap.yml 已废弃
  # 注意：DataId 必须与 Nacos 上注册的完全一致。本服务在 Nacos 上的 DataId 是
  # shopping_category_service-dev（无 .yaml 后缀），写成 -dev.yaml 会拉不到配置。
  # 环境配置是必需项，故不加 optional，缺失时直接启动失败而不是静默用默认值。
  config:
    import:
      - optional:nacos:shopping_category_service.yaml
      - nacos:shopping_category_service-dev.yaml
  # SCA 2025 的搜索前缀由 SPI 决定：classpath 存在 spring-cloud-starter-alibaba-nacos-* starter 时
  # 前缀是 spring.cloud.nacos，否则回落为 spring.nacos。两种写法保持同值，避免类路径变化导致配置失效。
  nacos:
    server-addr: ${NACOS_ADDR:192.168.66.100:8848}
    username: ${NACOS_USER:nacos}
    password: ${NACOS_PASSWORD:nacos}
    discovery:
      namespace: ${NACOS_NAMESPACE:8ae3393c-2080-4209-87a9-b3a5a948d68f}
      group: DEFAULT_GROUP
    config:
      namespace: ${NACOS_NAMESPACE:8ae3393c-2080-4209-87a9-b3a5a948d68f}
      group: DEFAULT_GROUP
      file-extension: yaml
      # NacosConfigProperties 的绑定前缀是 <prefix>.config，凭证必须写在这一层
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:nacos}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:192.168.66.100:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:8ae3393c-2080-4209-87a9-b3a5a948d68f}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:8ae3393c-2080-4209-87a9-b3a5a948d68f}
        group: DEFAULT_GROUP
        file-extension: yaml
        # 同上：配置中心凭证只认 spring.cloud.nacos.config.username/password
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASSWORD:nacos}
