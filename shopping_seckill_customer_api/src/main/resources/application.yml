spring:
  application:
    name: shopping_seckill_customer_api
  profiles:
    active: dev
  # Spring Cloud 2025 使用 spring.config.import 加载 Nacos 配置，bootstrap.yml 已废弃
  config:
    import:
      - optional:nacos:shopping_seckill_customer_api.yaml
      - optional:nacos:shopping_seckill_customer_api-dev.yaml
  # SCA 2025 的搜索前缀由 SPI 决定：classpath 存在 spring-cloud-starter-alibaba-nacos-* starter 时
  # 前缀是 spring.cloud.nacos，否则回落为 spring.nacos。两种写法保持同值，避免类路径变化导致配置失效。
  nacos:
    server-addr: ${NACOS_ADDR:192.168.66.100:8848}
    username: ${NACOS_USER:nacos}
    password: ${NACOS_PASSWORD:nacos}
    discovery:
      namespace: ${NACOS_NAMESPACE:8ae3393c-2080-4209-87a9-b3a5a948d68f}
      group: DEFAULT_GROUP
      # 注册到 Nacos 的 IP 必须与网关（192.168.66.100 上的 Higress）同网段可达，
      # 否则会被自动选中 VMnet1 的 192.168.28.1，网关连不上就报 local connection failure
      ip: 192.168.66.10
    config:
      namespace: ${NACOS_NAMESPACE:8ae3393c-2080-4209-87a9-b3a5a948d68f}
      group: DEFAULT_GROUP
      file-extension: yaml
      # NacosConfigProperties 的绑定前缀是 <prefix>.config，凭证必须写在这一层
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:nacos}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:192.168.66.100:8848}
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:8ae3393c-2080-4209-87a9-b3a5a948d68f}
        group: DEFAULT_GROUP
        # 同上：显式指定注册 IP，避免自动选中不可达的虚拟网卡地址
        ip: 192.168.66.10
      config:
        namespace: ${NACOS_NAMESPACE:8ae3393c-2080-4209-87a9-b3a5a948d68f}
        group: DEFAULT_GROUP
        file-extension: yaml
        # 同上：配置中心凭证只认 spring.cloud.nacos.config.username/password
        username: ${NACOS_USER:nacos}
        password: ${NACOS_PASSWORD:nacos}
dubbo:
  consumer:
    timeout: 5000
    check: false
  provider:
    timeout: 5000
