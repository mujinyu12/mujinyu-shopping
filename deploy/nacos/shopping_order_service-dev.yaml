# 端口号
server:
  port: 9010

# 日志格式
logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} %clr(%-5level) --- [%-15thread] %cyan(%-50logger{50}):%msg%n'

spring:
  application:
    name: shopping_order_service
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://__MYSQL_HOST__:3306/baizhanshopping?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: __MYSQL_PASSWORD__

# Dubbo
dubbo:
  application:
    name: shopping_order_service
    qos-enable: false
    serialize-check-status: DISABLE
    check-serializable: false
  protocol:
    name: dubbo
    port: -1
    # 多网卡机器建议显式指定注册 IP，否则 Dubbo 可能选到错误的网卡
    host: __DUBBO_HOST__
  registry:
    address: nacos://__INFRA_HOST__:8848
    username: nacos
    password: __NACOS_PASSWORD__
    parameters:
      namespace: __NACOS_NAMESPACE__

# MyBatis-Plus
mybatis-plus:
  global-config:
    db-config:
      table-prefix: bz_
      id-type: auto
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

#rocketmq
rocketmq:
  # nameserver地址
  name-server: __INFRA_HOST__:9876
  producer:
    #生产组
    group: my_group1
    # 发送消息超时时间
    send-message-timeout: 3000

# ===== Seata (client side) =====
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: mujinyu_tx_group
  enable-auto-data-source-proxy: true
  service:
    disable-global-transaction: false
    vgroup-mapping:
      mujinyu_tx_group: default
  registry:
    type: redis
    redis:
      server-addr: __INFRA_HOST__:6379
      db: 0
      timeout: 3000
  config:
    type: file
  client:
    rm:
      report-success-enable: false